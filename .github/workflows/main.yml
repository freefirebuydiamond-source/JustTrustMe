name: 3x-ui-Reality-Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Start 3x-ui via Docker
        run: |
          docker run -itd \
            -e XRAY_VMESS_AEAD_FORCED=false \
            -v $PWD/db/:/etc/xray-ui/ \
            -v $PWD/cert/:/root/cert/ \
            --network=host \
            --restart=unless-stopped \
            --name xray-ui \
            ghcr.io/mhsanaei/3x-ui:latest

      - name: Setup Cloudflare Tunnel (For Web Panel)
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared tunnel --url http://localhost:2053 > panel.log 2>&1 &
          
      - name: Setup Ngrok TCP Tunnel (For VLESS REALITY)
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          
          # سحب التوكن بأمان من قسم الـ Secrets
          ngrok config add-authtoken "$NGROK_TOKEN"
          
          # فتح بورت 443 للاتصال
          ngrok tcp 443 > ngrok.log 2>&1 &
          
      - name: Get Links and Wait
        run: |
          sleep 10
          echo "=========================================="
          echo "1. رابط لوحة التحكم (Cloudflare):"
          grep -o 'https://[-0-9a-zA-Z.]*.trycloudflare.com' panel.log
          echo "اليوزر: admin | الباسورد: admin"
          echo "------------------------------------------"
          echo "2. بيانات نفق الاتصال (Ngrok TCP):"
          curl -s localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          echo "=========================================="
          sleep 3600
